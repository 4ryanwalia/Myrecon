# Notify IndexNow after page or sitemap changes reach main, including updates
# pushed by the scheduled Breach Files job or manual workflow_dispatch runs.
name: IndexNow

on:
  push:
    branches: [main]
    paths:
      - "frontend/**/*.html"
      - "frontend/sitemap.xml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Submit changed or full-sitemap URLs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            node frontend/scripts/indexnow.js --sitemap
            exit 0
          fi

          mapfile -t pages < <(
            git diff --name-only "$BEFORE" "$AFTER" -- frontend |
              grep -E '^frontend/.*[.]html$' |
              grep -vE '^frontend/404[.]html$' || true
          )
          if (( ${#pages[@]} == 0 )); then
            echo "No indexable HTML URLs changed."
            exit 0
          fi

          urls=()
          for page in "${pages[@]}"; do
            if [[ -f "$page" ]]; then
              canonical=$(grep -oE '<link rel="canonical" href="https://www\.myrecon\.xyz[^"]*"' "$page" | head -n1 | sed -E 's/.*href="([^"]+)".*/\1/' || true)
              if [[ -n "$canonical" ]]; then
                urls+=("$canonical")
              else
                urls+=("https://www.myrecon.xyz/${page#frontend/}")
              fi
            fi
          done
          node frontend/scripts/indexnow.js "${urls[@]}"
