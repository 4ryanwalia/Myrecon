# Rebuilds /breaches/ and /blog/, refreshes the sitemap, then tells the search engines.
#
# The breach generator fetches the catalogue, writes its article pages and
# JSON feed. The blog generator renders the hand-written privacy articles, and
# the sitemap generator walks the final output so every indexable page is listed.
# Committing the result is what triggers a Vercel deploy, so the site updates
# itself without anyone touching it.
#
# It commits only when something actually changed — a no-op run leaves no
# commit behind, which keeps the history readable and avoids a deploy that
# ships nothing.
name: Breach Files

on:
  schedule:
    # Every six hours, off the hour. Whoever publishes the first useful page
    # on a new breach collects the links, so being early matters more here
    # than it does on evergreen pages — and GitHub queues scheduled jobs
    # hardest exactly on the hour, where a delay costs exactly that lead.
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: breach-files
  cancel-in-progress: false

jobs:
  build:
    # Keep workflow_dispatch on the default branch: only reviewed main-branch
    # workflow code receives the direct-push permission.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          ssh-key: ${{ secrets.BREACH_FILES_DEPLOY_KEY }}
          # build-sitemap.js uses the last file-changing commit as a truthful
          # lastmod fallback; a shallow checkout would replace those dates
          # with checkout-time mtimes across the whole site.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Generate articles
        working-directory: frontend
        run: |
          node scripts/build-breaches.js
          node scripts/build-blog.js
          node scripts/enhance-site-footer.js
          node scripts/version-site-assets.js
          node scripts/build-sitemap.js

      - name: Commit and publish generated pages
        id: commit
        run: |
          git add frontend
          if git diff --cached --quiet; then
            echo "No site updates this run."
            echo "changed=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Which article URLs actually changed. Worked out before the commit,
          # while git status still reports them as dirty. IndexNow asks for
          # changed URLs only — re-submitting untouched pages on every run is
          # how a domain gets its submissions throttled or ignored.
          CHANGED=$(git status --porcelain frontend/breaches frontend/blog | awk '{print $NF}' | grep -E '^frontend/(breaches|blog)/.*[.]html$' | sed 's|^frontend|https://www.myrecon.xyz|' | tr '\n' ' ')
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

          git config user.name "myrecon-bot"
          git config user.email "bot@myrecon.xyz"
          git commit -m "Breach Files: scheduled update"
          git push origin HEAD:main

      # The IndexNow workflow waits for a successful production deployment
      # before notifying search engines about this push.
