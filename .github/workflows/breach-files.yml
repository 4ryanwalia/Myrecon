# Rebuilds /breaches/ and /blog/, then proposes generated updates for review.
#
# The generator is the bulk of the job: it fetches the catalogue, writes the
# article pages, the JSON feed the app reads, and the sitemap entries.
# The protected main branch requires the maintainer's review. The scheduled job
# updates one pull request; merging it triggers the deploy and IndexNow workflow.
#
# It commits only when something actually changed — a no-op run leaves no
# commit behind, which keeps the history readable and avoids a deploy that
# ships nothing.
name: Breach Files

on:
  schedule:
    # Every six hours, off the hour. Whoever publishes the first useful page
    # on a new breach collects the links, so being early matters more here
    # than it does on evergreen pages — and GitHub queues scheduled jobs
    # hardest exactly on the hour, where a delay costs exactly that lead.
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: breach-files
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep commit history for the sitemap's truthful lastmod fallback.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate articles
        working-directory: frontend
        run: |
          node scripts/build-breaches.js
          node scripts/build-blog.js
          node scripts/enhance-site-footer.js
          node scripts/version-site-assets.js
          node scripts/build-sitemap.js

      - name: Propose changed pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Footer and asset versions can refresh pages outside article folders.
          git add frontend
          if git diff --cached --quiet; then
            echo "No site updates this run."
            exit 0
          fi

          git config user.name "myrecon-bot"
          git config user.email "bot@myrecon.xyz"
          git checkout -B automation/breach-files
          git commit -m "Refresh breach files and blog"
          git push --force-with-lease origin HEAD:refs/heads/automation/breach-files

          if gh pr view automation/breach-files --json url --jq .url >/dev/null 2>&1; then
            echo "Updated existing Breach Files pull request."
          else
            gh pr create --base main --head automation/breach-files \
              --title "Refresh breach files and blog" \
              --body "Scheduled generated content update. Please review the diff and approve before merge. IndexNow runs after the merged pages reach main."
          fi
