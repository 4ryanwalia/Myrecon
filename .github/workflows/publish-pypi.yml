name: Publish CLI to PyPI

# Uploads the `myrecon` package with PyPI Trusted Publishing: PyPI trusts this
# workflow in this repository, so no API token is stored anywhere. It runs only
# when started by hand (Actions > Publish CLI to PyPI > Run workflow) or when a
# tag like v1.0.1 is pushed. Bump `version` in pyproject.toml before each
# release: PyPI never accepts the same version twice.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp && /tmp/smoke/bin/myrecon --version
          /tmp/smoke/bin/myrecon platforms --json > /dev/null
          /tmp/smoke/bin/python -c "import importlib.util as u; assert u.find_spec('services') is None, 'backend leaked into site-packages'"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/myrecon
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
