<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
    <title id="title">How to Respond to a Social Media Impersonator</title>
    <desc id="desc">A three-step visual guide: Preserve evidence, Report the profile, Protect contacts.</desc>
