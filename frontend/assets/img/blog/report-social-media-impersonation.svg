    <path d="M0 549h1200M0 550l160-160M1040 390l160 160" stroke="#29445a" stroke-width="2" fill="none"/>
    <text x="74" y="88" fill="#9de5b8" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4">MYRECON FIELD GUIDE</text>
    <text x="74" y="162" fill="#f1f7f8" font-family="Arial,sans-serif" font-size="36" font-weight="700">ACCOUNT SAFETY</text>
    <g>
      <rect x="74" y="216" width="294" height="246" rx="22" fill="#18283a" stroke="#45647c" stroke-width="2"/>
      <circle cx="126" cy="275" r="26" fill="#24536c"/>
