      <text x="104" y="392" fill="#f1f7f8" font-family="Arial,sans-serif" font-size="27" font-weight="700">Preserve evidence</text>
    </g><g>
      <rect x="452" y="216" width="294" height="246" rx="22" fill="#18283a" stroke="#45647c" stroke-width="2"/>
      <circle cx="504" cy="275" r="26" fill="#24536c"/>
      <text x="504" y="284" text-anchor="middle" fill="#b9f5db" font-family="Arial,sans-serif" font-size="23" font-weight="700">02</text>
      <path d="M482 337h234" stroke="#39556a" stroke-width="2"/>
      <text x="482" y="392" fill="#f1f7f8" font-family="Arial,sans-serif" font-size="27" font-weight="700">Report the profile</text>
    </g><g>
      <rect x="830" y="216" width="294" height="246" rx="22" fill="#18283a" stroke="#45647c" stroke-width="2"/>
      <circle cx="882" cy="275" r="26" fill="#24536c"/>
      <text x="882" y="284" text-anchor="middle" fill="#b9f5db" font-family="Arial,sans-serif" font-size="23" font-weight="700">03</text>
      <path d="M860 337h234" stroke="#39556a" stroke-width="2"/>
      <text x="860" y="392" fill="#f1f7f8" font-family="Arial,sans-serif" font-size="27" font-weight="700">Protect contacts</text>
