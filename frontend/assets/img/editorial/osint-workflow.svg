<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">A five-step open-source intelligence workflow</title>
  <desc id="desc">Define a question, collect public sources, verify each finding, connect supported evidence, and report with source links.</desc>
  <rect width="960" height="300" rx="20" fill="#f4f6fb"/>
  <text x="36" y="51" fill="#17223a" font-family="Arial, sans-serif" font-size="25" font-weight="700">From a question to a defensible finding</text>
  <text x="36" y="81" fill="#53627b" font-family="Arial, sans-serif" font-size="16">Keep the source and the confidence level with every conclusion.</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="28" y="119" width="164" height="112" rx="14" fill="#e6eafe" stroke="#9aa8e9"/>
    <text x="110" y="158" fill="#263d91" font-size="16" font-weight="700">1. Define</text>
    <text x="110" y="185" fill="#314064" font-size="14">Ask one clear</text><text x="110" y="205" fill="#314064" font-size="14">question</text>
    <rect x="213" y="119" width="164" height="112" rx="14" fill="#e9f6f4" stroke="#8bbdb8"/>
    <text x="295" y="158" fill="#176056" font-size="16" font-weight="700">2. Collect</text>
    <text x="295" y="185" fill="#314064" font-size="14">Record public</text><text x="295" y="205" fill="#314064" font-size="14">sources</text>
    <rect x="398" y="119" width="164" height="112" rx="14" fill="#fff2df" stroke="#d4aa6b"/>
    <text x="480" y="158" fill="#875316" font-size="16" font-weight="700">3. Verify</text>
    <text x="480" y="185" fill="#314064" font-size="14">Check against</text><text x="480" y="205" fill="#314064" font-size="14">other evidence</text>
    <rect x="583" y="119" width="164" height="112" rx="14" fill="#e6eafe" stroke="#9aa8e9"/>
    <text x="665" y="158" fill="#263d91" font-size="16" font-weight="700">4. Correlate</text>
    <text x="665" y="185" fill="#314064" font-size="14">Connect only</text><text x="665" y="205" fill="#314064" font-size="14">supported links</text>
    <rect x="768" y="119" width="164" height="112" rx="14" fill="#e9f6f4" stroke="#8bbdb8"/>
    <text x="850" y="158" fill="#176056" font-size="16" font-weight="700">5. Report</text>
    <text x="850" y="185" fill="#314064" font-size="14">Cite sources and</text><text x="850" y="205" fill="#314064" font-size="14">uncertainty</text>
  </g>
  <path d="M195 175h13m172 0h13m172 0h13m172 0h13" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <text x="36" y="268" fill="#53627b" font-family="Arial, sans-serif" font-size="14">A matching username is a lead at step 2. It becomes a finding only after verification.</text>
</svg>
