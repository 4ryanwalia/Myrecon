<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
  <title id="title">Four recurring steps to reduce a digital footprint</title>
  <desc id="desc">Inventory public accounts and exposure, remove what is no longer needed, secure what remains, and revisit because new exposure can appear.</desc>
  <rect width="960" height="330" rx="20" fill="#f4f6fb"/>
  <text x="36" y="50" fill="#17223a" font-family="Arial, sans-serif" font-size="25" font-weight="700">A footprint audit is a recurring cycle</text>
  <text x="36" y="79" fill="#53627b" font-family="Arial, sans-serif" font-size="16">Start with the accounts and public details you control.</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="35" y="119" width="207" height="129" rx="14" fill="#e6eafe" stroke="#9aa8e9"/>
    <text x="138" y="154" fill="#263d91" font-size="18" font-weight="700">1. Inventory</text>
    <text x="138" y="184" fill="#314064" font-size="15">Search your public</text><text x="138" y="207" fill="#314064" font-size="15">profiles and records</text>
    <rect x="263" y="119" width="207" height="129" rx="14" fill="#e9f6f4" stroke="#8bbdb8"/>
    <text x="366" y="154" fill="#176056" font-size="18" font-weight="700">2. Remove</text>
    <text x="366" y="184" fill="#314064" font-size="15">Close unused accounts</text><text x="366" y="207" fill="#314064" font-size="15">and request opt-outs</text>
    <rect x="491" y="119" width="207" height="129" rx="14" fill="#fff2df" stroke="#d4aa6b"/>
    <text x="594" y="154" fill="#875316" font-size="18" font-weight="700">3. Secure</text>
    <text x="594" y="184" fill="#314064" font-size="15">Use unique passwords</text><text x="594" y="207" fill="#314064" font-size="15">and limit visibility</text>
    <rect x="719" y="119" width="207" height="129" rx="14" fill="#e6eafe" stroke="#9aa8e9"/>
    <text x="822" y="154" fill="#263d91" font-size="18" font-weight="700">4. Revisit</text>
    <text x="822" y="184" fill="#314064" font-size="15">Check for new accounts</text><text x="822" y="207" fill="#314064" font-size="15">and reappearing data</text>
  </g>
  <path d="M245 183h14m214 0h14m214 0h14" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <text x="36" y="293" fill="#53627b" font-family="Arial, sans-serif" font-size="14">Removal can take time and may need repeating; keep a record of your requests.</text>
</svg>
