<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 375" role="img" aria-labelledby="title desc">
  <title id="title">How to read a suspicious web address</title>
  <desc id="desc">The actual registered domain is read from the right of the hostname. In the example, login.bank.example is under bank.example, but bank.example.verify-login.test is under verify-login.test.</desc>
  <rect width="960" height="375" rx="20" fill="#f4f6fb"/>
  <text x="36" y="48" fill="#17223a" font-family="Arial, sans-serif" font-size="25" font-weight="700">Read the hostname from right to left</text>
  <text x="36" y="77" fill="#53627b" font-family="Arial, sans-serif" font-size="16">These example domains are illustrative. A familiar word on the left does not prove ownership.</text>
  <g font-family="Arial, sans-serif">
    <rect x="36" y="106" width="888" height="96" rx="14" fill="#e5f4ec" stroke="#94c9a7"/>
    <text x="58" y="138" fill="#185b39" font-size="16" font-weight="700">Under the expected domain</text>
    <text x="58" y="174" fill="#253349" font-size="23" font-weight="700">login.<tspan fill="#185b39">bank.example</tspan></text>
    <text x="552" y="171" fill="#2e5340" font-size="15">Registered domain: bank.example</text>
    <rect x="36" y="215" width="888" height="96" rx="14" fill="#fff2df" stroke="#d4aa6b"/>
    <text x="58" y="247" fill="#875316" font-size="16" font-weight="700">A different domain</text>
    <text x="58" y="283" fill="#253349" font-size="23" font-weight="700">bank.example.<tspan fill="#a04e14">verify-login.test</tspan></text>
    <text x="552" y="280" fill="#875316" font-size="15">Registered domain: verify-login.test</text>
    <text x="36" y="349" fill="#53627b" font-size="14">If a message asks you to sign in, open your saved app or bookmark yourself instead of following its link.</text>
  </g>
</svg>
